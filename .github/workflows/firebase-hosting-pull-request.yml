name: Preview Portfolio on Pull Request

on:
  pull_request:
    paths:
      - 'portfolio/**'
      - '.github/workflows/firebase-hosting-pull-request.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_preview:
    name: Build and deploy preview channel
    # Forks se aane wale PRs par secrets available nahi hote
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_C1398 }}
          projectId: portfolio-c1398
          entryPoint: portfolio
          expires: 7d
