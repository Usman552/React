name: Deploy Portfolio to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio/**'
      - '.github/workflows/firebase-hosting-merge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: Build and deploy to live channel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_C1398 }}
          projectId: portfolio-c1398
          channelId: live
          entryPoint: portfolio
